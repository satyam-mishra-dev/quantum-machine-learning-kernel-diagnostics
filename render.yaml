services:
  - type: web
    name: q-nidaan-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn qnidaan.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

  # Keeps the free web service from idling out (spindown is 15 min of no
  # inbound traffic). Render cron jobs are not on the free plan — see notes.
  - type: cron
    name: q-nidaan-keepalive
    runtime: python
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: echo no-deps
    startCommand: >-
      python -c "import urllib.request as u;
      u.urlopen('https://q-nidaan-api.onrender.com/api/datasets', timeout=60)"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
